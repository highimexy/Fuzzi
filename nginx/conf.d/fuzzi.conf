upstream fuzzi_frontend { server frontend:3000; }
upstream fuzzi_backend  { server backend:8080; }

# Shared proxy headers. X-Forwarded-For prefers Cloudflare's real visitor IP
# (set by cloudflare-realip.conf) so the backend rate limiter keys correctly.
map $http_cf_connecting_ip $client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m; # avatar uploads

    # API, WebSocket and uploaded files → Go backend
    location /api/ {
        proxy_pass http://fuzzi_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://fuzzi_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_read_timeout 3600s;
    }

    location /uploads/ {
        proxy_pass http://fuzzi_backend;
        proxy_set_header Host $host;
    }

    # Everything else → Next.js
    location / {
        proxy_pass http://fuzzi_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

